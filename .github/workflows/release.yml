name: Release

# 推送 v1.2.3 形式的标签即自动构建三个平台并发布 Release。
# 手动运行（workflow_dispatch）只构建并上传构建产物，不创建 Release。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          build_name="${version#v}"
          build_name="${build_name%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"

  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows x64
    needs: [meta, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: >-
          flutter build windows --release
          --build-name ${{ needs.meta.outputs.build_name }}
          --build-number ${{ github.run_number }}
          --dart-define=APP_VERSION=${{ env.VERSION }}
      - name: Package
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          # 附带 VC++ 运行库，避免没装运行库的电脑提示缺少 MSVCP140.dll（微软允许随应用分发）。
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" $bundle
          }
          Copy-Item "packaging/windows/README.txt" "$bundle/使用说明.txt"
          Copy-Item LICENSE "$bundle/LICENSE.txt"
          $name = "zipliner-client-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Rename-Item $bundle $name
          # 在 runner 目录里打包，压缩包根目录就是程序文件夹，解压后不会多出 build\windows\... 几层目录。
          Push-Location build/windows/x64/runner
          7z a -tzip "$env:GITHUB_WORKSPACE/dist/$name.zip" $name
          Pop-Location
          $exe = 7z l -slt "dist/$name.zip" | Select-String -SimpleMatch "Path = $name\zipliner_client.exe"
          if (-not $exe) { throw "压缩包结构不对：根目录下找不到 $name\zipliner_client.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    name: Linux x64
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: >-
          flutter build linux --release
          --build-name ${{ needs.meta.outputs.build_name }}
          --build-number ${{ github.run_number }}
          --dart-define=APP_VERSION=${{ env.VERSION }}
      - name: Package
        run: |
          name="zipliner-client-${VERSION}-linux-x64"
          mkdir -p dist
          cp -r build/linux/x64/release/bundle "$name"
          cp LICENSE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  android:
    name: Android
    needs: [meta, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，APK 将使用临时 debug 签名，用户无法覆盖安装升级。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - name: Build
        run: >-
          flutter build apk --release
          --build-name ${{ needs.meta.outputs.build_name }}
          --build-number ${{ github.run_number }}
          --dart-define=APP_VERSION=${{ env.VERSION }}
      - name: Package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/zipliner-client-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [meta, windows, linux, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" packaging/release-notes.md > notes.md
          gh release create "$VERSION" dist/* \
            --title "终末地坐标工具 ${VERSION}" \
            --notes-file notes.md \
            --generate-notes
